runtime: paperclip
source: >-
  IDENTIDADE, re-lida em 2026-10-25 contra
  rclr-labs/paperclip, em docs/companies/companies-spec.md
  (versão `agentcompanies/v1-draft`).
  A emissão copia o pacote byte a byte — isso não mudou. O que a leitura
  corrigiu é a afirmação de "zero perda": ela era verdadeira só por
  confundir SOBREVIVER NO ARQUIVO com SER APLICADO PELO RUNTIME. A spec
  base (§5–§13) define `AGENTS.md` com `name`, `title`, `reportsTo`,
  `skills` e o corpo — e PARA POR AÍ. `budget`, permissão de execução,
  restrição de rede e portão de aprovação não aparecem em lugar nenhum do
  formato base; §15 os nomeia só como EXEMPLO do que uma extensão de
  fornecedor carrega, num arquivo `.paperclip.yaml` separado que este
  acervo não escreve. Logo: o arquivo sobrevive (cópia byte a byte,
  sempre), mas só o que a spec base de fato define É AGIDO pelo runtime —
  o resto é preservado sem ser lido como fronteira por nada.
emits: <pacote>/
format: identity
rule_order: first-match # identidade não resolve regra nenhuma; campo presente só porque o esquema de três estados o exige quando preenchido — aqui é vestigial.
allowlist_scope: os # idem: identidade não impõe allowlist nenhuma; o valor não tem efeito em applyBinding porque nenhuma capacidade desta tabela está em `translates` para rede.
translates:
  # skills é o ÚNICO ponto desta tabela que a spec base de fato define
  # (§5, AGENTS.md: "name, title, reportsTo, skills (shortname refs)") —
  # não é extensão de fornecedor, é vocabulário central do formato. Um
  # runtime Paperclip real resolve a referência de skill contra
  # `skills/<slug>/SKILL.md` do mesmo pacote; a cópia byte a byte
  # preserva o campo E a resolução continua válida, porque nada mudou na
  # estrutura de arquivo que a resolução depende.
  skills: []
preserves:
  - read.repository
  - read.documentation
  - read.audit_trail
  - read.test_evidence
  - read.database
  - read.web
  - write.code
  - write.documentation
  - write.test_evidence
  - write.report
  - write.pull_request
  - execute.allow
  - execute.deny
  - network
  - network.allowlist
  - delegate
  - budget
  - approve
  - memory
  - context
loses: []
# Fix round 1: citações unificadas por GRUPO semântico, texto idêntico
# para toda chave do mesmo grupo. Isso não é só estilo — é o que permite
# ao emissor agregar o aviso por MOTIVO em vez de por papel × capacidade
# (achado 2 da auditoria: 66 linhas carregando duas informações é pior
# que duas linhas). Duas citações quase-iguais ("mesma leitura de X") em
# vez de UMA citação repetida teriam produzido dois grupos de aviso onde
# devia haver um.
citations:
  skills: "companies-spec.md §5 — AGENTS.md define `skills`; cópia byte a byte preserva e a resolução do runtime continua válida"
  # Grupo 1 — nenhum destes é campo da spec base (§5–§13): vive em
  # metadata, extensão deste acervo, não do formato.
  read.repository: &nao-e-spec-base "companies-spec.md §5–§13 — não é campo da spec base; vive em metadata, extensão deste acervo"
  read.documentation: *nao-e-spec-base
  read.audit_trail: *nao-e-spec-base
  read.test_evidence: *nao-e-spec-base
  read.database: *nao-e-spec-base
  read.web: *nao-e-spec-base
  write.code: *nao-e-spec-base
  write.documentation: *nao-e-spec-base
  write.test_evidence: *nao-e-spec-base
  write.report: *nao-e-spec-base
  write.pull_request: *nao-e-spec-base
  delegate: *nao-e-spec-base
  memory: *nao-e-spec-base
  context: *nao-e-spec-base
  # Grupo 2 — citados nominalmente em §15 como EXEMPLO de extensão de
  # fornecedor (.paperclip.yaml): a spec sabe que existem, mas não os
  # define no formato base.
  execute.allow: &extensao-de-fornecedor "companies-spec.md §15 — citado como exemplo de extensão de fornecedor (.paperclip.yaml), não campo da spec base"
  execute.deny: *extensao-de-fornecedor
  network: *extensao-de-fornecedor
  network.allowlist: *extensao-de-fornecedor
  budget: *extensao-de-fornecedor
  approve: *extensao-de-fornecedor
unsupported: []
unsupported_metadata: []
