runtime: opencode
source: >-
  MEDIDO em 2026-10-25, substituindo a observação pendente anterior. O
  binding antigo foi lido de rclr-labs/dev-factory — um formato V1
  (`permission: {edit, bash: {glob: allow|deny}, task: {slug: allow|deny}}`,
  `temperature`), nunca confirmado contra documentação. A medição confirma
  DUAS correções de identidade antes de qualquer célula: (1) `sst/opencode`
  foi movido para `anomalyco/opencode` — mesmo projeto, outra org, confirmado
  via `gh api repos/sst/opencode` (redireciona); (2) o formato V1 lido é
  REAL mas DEPRECADO — V2 é o atual, com nomes de campo e estrutura de dados
  diferentes (array de regras, não dict de glob). Doc da própria V2:
  "V1 uses different field and action names. In V2, use `permissions`,
  `shell`, and `subagent` instead of `permission`, `bash`, and `task`" e
  "Do not use legacy top-level fields such as `temperature`... in new V2
  agent configuration." Fontes lidas em 2026-10-25:
  `packages/schema/src/config/agent.ts` (ConfigAgent.Info),
  `packages/schema/src/permission.ts`, `services/www/src/docs/content/
  agents.mdx` e `permissions.mdx`, todas do repo `anomalyco/opencode`
  (via `gh api`, não checkout local — não existe opencode local em ~/work
  ou ~/apps).

  FIX ROUND 1 (2026-10-26, auditoria de "translates significa emitido"):
  `approve` estava em `translates` citando o efeito `ask`, mas
  `buildPermissions()` (tools/bindings.mjs) nunca escreve uma regra
  `ask` — mesmo defeito corrigido em claude-code.yml na mesma rodada.
  Movido para `loses`. Também corrigidas duas regras de
  `buildPermissions()` que o audit encontrou quebradas para QUALQUER
  binding que as use: `edit` só disparava para `write.code` (um papel
  que escreve `documentation`/`test_evidence`/`report` sem escrever
  código ficava com `edit: deny`, contradizendo o que a tabela abaixo
  declara como traduzido), e `webfetch` só disparava para `read.web`
  (um papel com `network: true` sem `read.web` ficaria com `webfetch:
  deny`). As duas foram corrigidas no código, não na tabela — a tabela
  já estava certa, o código é que não implementava o que ela dizia.
emits: agents/<slug>.md
format: opencode
# last-match: packages/schema/src/permission.ts + permissions.mdx
# ("Matching"/"Agents"): regras de `permissions` combinam em ARRAY,
# última-regra-vence — built-in defaults → config de projeto → regras do
# agente, nessa ordem, e a ÚLTIMA que bate decide. Isso inverte o modelo
# "mais específica vence" que o binding V1 assumia (dict de glob). Emitir
# um array pensado para primeira-vence (deny amplo depois de um allow
# específico) produz exatamente o oposto da intenção, em silêncio.
rule_order: last-match
# allowlist_scope: fetch-only. A única ação com formato de rede é
# `webfetch`, cujo resource é a URL requisitada — então um glob de domínio
# governa só a CHAMADA DE BUSCA da ferramenta. `shell` é ação separada cujo
# resource é "o texto do comando produzido pelo scanner", sem noção de
# host — um papel com `shell` liberado e um comando como curl/wget alcança
# qualquer host que o processo alcançar, e a allowlist de webfetch não
# ajuda nada. Fonte: permissions.mdx, citado em agent-studio/docs/pesquisa/
# 2026-10-25-runtimes-medidos.md §3.2: "`shell` runs with the host user's
# filesystem, process, and network authority... prefer a narrow shell
# allowlist instead of patterns intended to recognize every dangerous
# command."
allowlist_scope: fetch-only
# Dispara buildPermissions() em tools/bindings.mjs, que monta o array V2
# `{action, resource, effect}` em ordem deny-amplo-primeiro, na semântica
# de last-match. O valor aqui só precisa ser truthy — a lista real é
# construída a partir de `capabilities`, não de um default estático
# declarado em YAML, porque V2 não tem um "default" único (built-in →
# projeto → agente, mesclados).
permissions: v2
translates:
  read.repository: []
  read.documentation: []
  read.audit_trail: []
  read.test_evidence: []
  read.web: []
  write.documentation: []
  write.test_evidence: []
  write.report: []
  write.pull_request: []
  write.code: []
  # execute.allow/deny: ação `shell`, resource = texto do comando (glob
  # `*`/`?` sobre a string normalizada do comando inteiro). Confirmado em
  # permissions.mdx e packages/schema/src/permission.ts.
  execute.allow: []
  execute.deny: []
  network: []
  # network.allowlist: ação `webfetch`, resource = URL requisitada — glob
  # de domínio via `{action:"webfetch", resource:"https://dominio/*",
  # effect:"allow"}` mais um deny-all ANTES dele na lista (last-match:
  # o allow específico tem de vir depois para vencer). EMITIDO de
  # verdade (fix round 1): buildPermissions() em tools/bindings.mjs
  # escreve as duas regras por domínio, dentro do frontmatter de CADA
  # agente — sem o risco de conflito entre papéis que a Opção A teve no
  # Claude Code (não há arquivo de projeto compartilhado aqui). Só cobre
  # a chamada de busca da ferramenta — ver allowlist_scope acima para a
  # ressalva que importa (shell cru escapa por completo).
  network.allowlist: []
  delegate: []
preserves: []
loses:
  # budget: busca em Config.Info, ConfigAgent.Info e `gh api search/code`
  # por budget/monthly_cap/spend_limit/cost_cap/spending_limit no repo
  # inteiro — zero ocorrência em todo o schema do runtime. Existe
  # `policies` (allow/deny binário de provider/tool/integration), mas não
  # tem moeda, teto nem alerta.
  - budget
  # skills: ausência confirmada em ConfigAgent.Info (agent.ts) — não tem
  # campo `skills`. Existe uma ação de PERMISSÃO chamada `skill`
  # (resource = skill ID) em permission.ts, mas essa ação controla se o
  # agente PODE invocar uma skill já carregada — não é o mecanismo de
  # DECLARAR quais skills o papel preload no startup, que é o que este
  # acervo expressa. Usar a ação `skill` aqui seria emprestar um
  # mecanismo de controle de acesso como se fosse o de carregamento — o
  # mesmo tipo de erro que motivou a tarefa 27 inteira.
  - skills
  # memory: nenhum campo em Config.Info nem ConfigAgent.Info.
  - memory
  # context: nenhum campo correspondente — ausência confirmada junto com
  # memory, mesma leitura de agent.ts.
  - context
not_emitted:
  # approve: TAREFA 30 — sai de `loses`, entra aqui. O efeito `ask`
  # (resource = texto de comando) é mecanismo real, mas buildPermissions()
  # (tools/bindings.mjs) nunca escreve uma regra `ask` — e, como no Claude
  # Code, não haveria dado no pacote para construir o `resource` certo:
  # capabilities.approve referencia `human_gates[].id`, não um padrão de
  # comando. Diferente do Claude Code, este binding NÃO ganhou emissão de
  # human_gates[].triggers na tarefa 30 (fora do escopo declarado — ver
  # SCHEMA.md §8); a lacuna aqui é só a de engenharia (não emitimos),
  # nunca a de dado (triggers existiria se escrevêssemos o código).
  approve:
    mechanism: "ação ask (packages/schema/src/permission.ts), resource = texto do comando"
    falta: "buildPermissions() não escreve regra ask; capabilities.approve não carrega o padrão de comando que ela exigiria; o signer nomeado também não é modelado em capabilities/v1"
  # read.database: TAREFA 30 — sai de `loses`, entra aqui. `read` é ação
  # só de sistema de arquivo (resource = caminho); o único jeito de
  # alcançar um banco é via servidor MCP, cuja ação é `<server>_<tool>`
  # com resource `*` — concede/nega a TOOL inteira, sem distinguir SELECT
  # de DROP TABLE. Essa coarseza é real, mas não é o que bloqueia a
  # emissão: mesmo a regra grosseira exigiria nomear o servidor, e nenhum
  # AGENTS.md do acervo declara qual servidor MCP expõe o banco — mesma
  # lacuna de dado do Claude Code.
  read.database:
    mechanism: "ação <server>_<tool> (permissions.mdx), allow/deny da ferramenta MCP inteira"
    falta: "o pacote não declara qual servidor MCP expõe o banco; mesmo com o nome, a ação só concede/nega a ferramenta inteira, sem distinguir leitura de escrita dentro dela"
citations:
  read.repository:
    inferido: true
    source: "destino [] por desenho — V2 não tem lista de tools por ação de leitura separada do resource de caminho; ação `read` com resource `*` cobre o alcance, ver permissions.mdx"
  read.documentation:
    inferido: true
    source: "mesma leitura de read.repository"
  read.audit_trail:
    inferido: true
    source: "mesma leitura de read.repository"
  read.test_evidence:
    inferido: true
    source: "mesma leitura de read.repository"
  read.web:
    inferido: true
    source: "mapeia para a ação webfetch/websearch, mesma fonte de network.allowlist abaixo"
  write.documentation: "permissions.mdx — ação `edit`, resource = caminho (cobre edit/write/patch)"
  write.test_evidence: "permissions.mdx — ação `edit`"
  write.report: "permissions.mdx — ação `edit`"
  write.pull_request:
    inferido: true
    source: "sem ação dedicada a pull request; passa por `shell` (git/gh via linha de comando) — observado, não é campo próprio do schema"
  write.code: "permissions.mdx — ação `edit`"
  execute.allow: "permissions.mdx + packages/schema/src/permission.ts — ação `shell`, lidos 2026-10-25"
  execute.deny: "permissions.mdx + packages/schema/src/permission.ts — ação `shell`, last-match, lidos 2026-10-25"
  network:
    inferido: true
    source: "alcance geral mapeado para a mesma ação webfetch/websearch de read.web — V2 não distingue 'tem rede' de 'tem busca'"
  network.allowlist: "permissions.mdx — ação `webfetch`, resource = URL requisitada, lido 2026-10-25; EMITIDO em tools/bindings.mjs (fix round 1) como deny-geral + allow por domínio, dentro do frontmatter de cada agente"
  delegate: "agents.mdx — ação `subagent`, resource = id do agente alvo, lido 2026-10-25"
  approve: "permissions.mdx — efeito `ask` é mecanismo real, mas NÃO emitido (tarefa 30, not_emitted): buildPermissions() não escreve regra ask, e capabilities.approve não carrega o padrão de comando que ela exigiria"
  budget:
    inferido: true
    source: "ausência confirmada por gh api search/code em anomalyco/opencode por budget|monthly_cap|spend_limit|cost_cap|spending_limit — zero ocorrência, lido 2026-10-25"
  read.database: "permissions.mdx — ação `read` é só caminho de arquivo; `<server>_<tool>` é grosseiro demais e, de qualquer forma, NÃO emitido (tarefa 30, not_emitted): nenhum AGENTS.md nomeia o servidor, lido 2026-10-25"
  skills:
    inferido: true
    source: "ausência confirmada em packages/schema/src/config/agent.ts (ConfigAgent.Info sem campo skills) + permissions.mdx (ação `skill` é controle de acesso, não declaração), lidos 2026-10-25"
  memory: "packages/schema/src/config/agent.ts — ausência confirmada, lido 2026-10-25"
  context: "packages/schema/src/config/agent.ts — ausência confirmada, lido 2026-10-25"
unsupported: []
unsupported_metadata: []
