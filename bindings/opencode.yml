runtime: opencode
source: >-
  OBSERVADO, PENDENTE DE CONFIRMAÇÃO. Formato lido de rclr-labs/dev-factory
  (agents/*.md com mode: subagent, temperature, color e um bloco permission
  com edit, bash por glob e task por slug). Não foi confirmado contra a
  documentação do runtime; até que seja, este binding não é declarado
  verificado.
emits: agents/<slug>.md
format: opencode
# last-match: medido em anomalyco/opencode — packages/schema/src/permission.ts
# e permissions.mdx ("Matching"/"Agents"): regras combinam última-vence, não
# mais-específica-vence. Reescrita completa de source e mecanismo chega na
# tarefa 28; este campo é adicionado agora porque o esquema de três estados
# já exige a declaração.
rule_order: last-match
permissions:
  defaults:
    edit: deny
    bash: {}
    task: {}
    webfetch: deny
map:
  read.repository: []
  read.documentation: []
  read.audit_trail: []
  read.test_evidence: []
  read.web: []
  write.documentation: []
  write.test_evidence: []
  write.report: []
  write.pull_request: []
  write.code: []
  execute.allow: []
  execute.deny: []
  network: []
  delegate: []
unsupported:
  - budget
  - approve
  - read.database
  # permission.webfetch é allow/deny, sem lista de domínio.
  - network.allowlist
unsupported_metadata:
  - memory
  - context
  # skills: ponte mínima da tarefa 27 — ver nota equivalente em
  # claude-code.yml. A tarefa 28 confirma que skills NÃO é campo de
  # ConfigAgent.Info em opencode V2 (ausente de agent.ts e de agents.mdx),
  # então aqui o estado real após a medição continua `loses`, não muda.
  - skills
