runtime: portable
source: >-
  DESENHO PRÓPRIO. Alvo sem perda, para runtime cujo loader ainda não foi
  lido de fonte primária. Emite o manifesto completo em JSON, com toda
  capacidade, orçamento, portão e contexto preservados, para que o
  adaptador do runtime leia o que precisar sem reinterpretar markdown.

  ACHADO que muda a pendência "promover portable → janus" (medido em
  2026-10-25, agent-studio/docs/pesquisa/2026-10-25-runtimes-medidos.md
  §5.1): janus NÃO TEM formato de agente/papel nenhum. Busca explícita por
  `AGENTS\.md|agentDefinition|roleConfig|org.?chart` em `src/` e `docs/`
  do checkout local (`~/apps/janus`) não encontra nada — zero conceito de
  organograma, empresa, time ou papel persistente. O que janus tem é uma
  unidade de governança diferente: `Mission` (`*.mission.json`,
  `src/core/mission.ts`), por TAREFA, não por papel — toda chamada
  redeclara escopo, orçamento, regra de permissão e aprovação do zero, sem
  identidade que atravesse duas tarefas.

  Isso NÃO é um binding que falta escrever — é uma pergunta sobre se janus
  deveria ganhar o conceito de papel persistente. Escrever um
  `bindings/janus.yml` hoje seria inventar um mapa de "um papel do
  organograma = um Mission" sem o janus ter pedido isso, e sem garantia de
  que a correspondência é 1:1 (um papel pode gerar Missions diferentes em
  tarefas diferentes, com escopo que não é superset nem subset um do
  outro). A decisão é do Rafael, não deste binding — por isso o portable
  continua sendo o alvo sem perda genérico, e nenhum binding chamado
  "janus" existe nesta pasta.
emits: agent-manifest.json
format: portable
rule_order: first-match # portable não resolve regra de permissão nenhuma — campo presente porque o esquema o exige; vestigial aqui como em paperclip.yml.
allowlist_scope: os # idem: nenhuma capacidade desta tabela está em `translates`, então o valor não produz efeito em applyBinding.
# Nada aqui é `translates`: o manifesto JSON é um CARREGADOR de dado, não
# um runtime que age sobre ele — a mesma distinção que corrigiu
# paperclip.yml. "Zero perda" continua verdadeiro (nada entra em `loses`),
# mas "zero perda" não é mais confundido com "tudo aplicado".
translates: {}
preserves:
  - read.repository
  - read.documentation
  - read.audit_trail
  - read.test_evidence
  - read.database
  - read.web
  - write.code
  - write.documentation
