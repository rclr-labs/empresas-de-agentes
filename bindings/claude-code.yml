runtime: claude-code
source: >-
  VERIFICADO em 2026-10-24 por leitura direta do formato em uso (plugin
  dev-squad e ~/.claude/agents) para name/description/tools/delegate — e
  RE-VERIFICADO em 2026-10-25 por leitura direta da documentação primária
  (code.claude.com/docs/en) para as cinco capacidades que a pesquisa
  agent-studio/docs/pesquisa/2026-10-25-runtimes-medidos.md corrigiu.

  FIX ROUND 1 (2026-10-25, auditoria pós-tarefa-29): a primeira reescrita
  cometeu a MESMA classe de defeito que corrigia — declarou `translates`
  no nível de "o que o runtime consegue expressar" em vez de "o que este
  emissor de fato escreve no arquivo". `execute.deny`, `read.database` e
  `approve` citavam mecanismo real (confirmado por leitura), mas
  `tools/writers.mjs` não produz nenhum dos três: `disallowedTools` só
  dispara no caso raro em que `execute.allow` está vazio (nenhum papel do
  acervo cai nisso), `read.database` exigiria nomear um servidor MCP que
  o pacote não declara, e `approve` exigiria um padrão de comando que
  `capabilities.approve` (que só referencia `human_gates[].id`) não
  carrega. Investiguei a Opção A (emitir um `.claude/settings.json` de
  projeto com a união de `execute.deny` de todos os papéis) e descobri
  que é ATIVAMENTE PERIGOSA para este acervo, não só incompleta:
  `deny` do Claude Code vale independente de escopo
  ("deny rules from any scope are evaluated before allow rules",
  code.claude.com/docs/en/permissions) — então a união de deny de
  `software-house` bloquearia `git push*`/`git commit*` para
  `desenvolvimento`, que é o ÚNICO papel que precisa deles e os declara
  em `execute.allow`. Um binding que "traduz" `execute.deny` dessa forma
  quebraria o papel que mais precisa de `execute.allow` no mesmo pacote.
  Por isso escolhi a Opção B para as três: mover para `loses`, com o
  mecanismo real nomeado no motivo. `network.allowlist` passou pela MESMA
  pergunta e sobreviveu como `translates`, porque a Opção A ali é segura
  neste acervo (nenhum pacote publicado tem um papel com `network: true`
  convivendo com um papel de outro escopo que precisasse de allowlist
  restrita no MESMO pacote) — `tools/emit.mjs` agora emite de fato um
  `.claude/settings.json` com `sandbox.network.allowedDomains`.
emits: .claude/agents/<slug>.md
format: claude-code
# first-match (leitura honesta, não medição direta): a doc de permissões
# (code.claude.com/docs/en/permissions, "The same holds across settings
# scopes: ... deny rules from any scope are evaluated before allow rules")
# descreve deny-sempre-vence, independente de posição na lista — mais perto
# do modelo first-match (checa deny antes de qualquer allow, não importa a
# ordem de escrita) do que do last-match do OpenCode V2. Não há tabela
# explícita "first-match vs last-match" na doc do Claude Code porque o
# conceito de ordenação de lista não é o mecanismo real — é a aproximação
# mais honesta dentro do vocabulário deste binding.
rule_order: first-match
# allowlist_scope: os. sandbox.network.allowedDomains é interceptado pelo
# proxy de sandbox do sistema operacional (Seatbelt no macOS, namespace de
# rede no Linux/WSL2), e cobre TODO processo filho, shell cru incluído —
# não só a tool de busca. Fonte: code.claude.com/docs/en/sandboxing,
# lido em 2026-10-25 ("Claude Code runs the sandbox proxy on your machine,
# outside the sandbox... The proxy checks the hostname of each connection
# against your allowed and denied domains"). CAVEAT que sobrevive do fix
# round 1: o `.claude/settings.json` emitido é de ESCOPO DE PROJETO, não
# por agente — um papel com `network: false` ainda compartilha a mesma
# allowedDomains que um papel do mesmo pacote com domínio declarado,
# porque o sandbox não tem campo por agente confirmado em nenhuma doc
# lida. É alargamento de fronteira para o papel `network: false`, não
# estreitamento — documentado aqui, não escondido.
allowlist_scope: os
translates:
  read.repository: [Read, Grep, Glob]
  read.documentation: [Read, Grep, Glob]
  read.audit_trail: [Read, Grep, Glob]
  read.test_evidence: [Read, Grep, Glob]
  read.web: [WebFetch, WebSearch]
  write.code: [Write, Edit]
  write.documentation: [Write, Edit]
  write.test_evidence: [Write, Edit]
  write.report: [Write, Edit]
  write.pull_request: [Bash]
  execute.allow: [Bash]
  network: [WebFetch, WebSearch]
  delegate: "Agent({slug})"
  # network.allowlist: EMITIDO de verdade (fix round 1). tools/emit.mjs
  # escreve `.claude/settings.json` com `sandbox.network.allowedDomains`
  # = união dos domínios de `capabilities.network` de todo agente do
  # pacote — allowlist de SISTEMA OPERACIONAL, cobre shell cru também
  # (ver allowlist_scope acima). Destino [] porque o mecanismo não entra
  # na lista `tools` do frontmatter — vive num arquivo-irmão.
  network.allowlist: []
  # skills: EMITIDO de verdade — tools/writers.mjs escreve `skills:` no
  # frontmatter a partir de `frontmatter.skills`, testado em
  # test/emit.test.mjs. Destino [] porque não é "ferramenta", é campo de
  # frontmatter escrito direto.
  skills: []
  # memory: EMITIDO de verdade — mesma lógica de skills, a partir de
  # `metadata.memory.scope`. Vocabulário de VALOR não combina 1:1 (este
  # acervo usa none/session/project/org; Claude Code usa
  # user/project/local) — "project" coincide, os outros três são
  # aproximação do emissor, não medição. O CAMPO traduz; o valor fora de
  # "project" é aproximação assumida, não garantida.
  memory: []
preserves: []
loses:
  # budget: sem teto de moeda em lugar nenhum da configuração do Claude
  # Code (frontmatter de sub-agente ou settings.json) — busca feita em
  # code.claude.com/docs/en/sub-agents e code.claude.com/docs/en/settings
  # não encontrou campo de custo. `maxTurns` existe (confirmado,
  # sub-agents) mas é teto de QUANTIDADE DE TURNO, não de GASTO.
  - budget
  # execute.deny: FIX ROUND 1 — movido de translates para loses. O
  # mecanismo citado (disallowedTools nome puro + permissions.deny de
  # projeto + hook PreToolUse/agent_type) é real, mas este emissor não
  # produz nenhum dos dois últimos, e o primeiro só dispara no caso raro
  # em que execute.allow está vazio (nenhum papel do acervo hoje). Pior:
  # uma emissão por união de projeto (a alternativa óbvia) seria ATIVA-
  # MENTE ERRADA aqui — software-house/desenvolvimento declara
  # `execute.allow: [..., "git push*", "git commit*", ...]`, e QUATRO
  # outros papéis do mesmo pacote declaram esses mesmos padrões em
  # `execute.deny`; como o Claude Code resolve deny-sempre-vence
  # independente de escopo, uma lista de projeto feita da união dos
  # `execute.deny` bloquearia o `git push`/`git commit` que
  # desenvolvimento precisa e tem permissão explícita para usar. Perder
  # é mais honesto do que "traduzir" de um jeito que quebra o papel que
  # mais precisa do `execute.allow` correspondente.
  - execute.deny
  # read.database: FIX ROUND 1 — movido de translates para loses. O
  # mecanismo (tool do servidor MCP + disallowedTools: Bash) é real, mas
  # exige nomear um servidor MCP concreto que nenhum AGENTS.md do acervo
  # declara — não há dado para o emissor escrever, e inventar um nome de
  # servidor seria fabricar informação que o papel não forneceu.
  - read.database
  # approve: FIX ROUND 1 — movido de translates para loses.
  # `permissions.ask` é mecanismo real, mas `capabilities.approve`
  # referencia `human_gates[].id` (ex.: "deploy-producao"), não um
  # padrão de comando Bash — não há dado no pacote para construir o
  # `resource` (`"Bash(terraform apply:*)"`) que a regra `ask` exige.
  # Sem esse padrão, não há o que escrever. approve.signer (ressalva do
  # assinante nomeado, que o mecanismo também não cobre) continua
  # documentado em prosa aqui, não como chave própria — crescer o
  # vocabulário é mudança de capabilities/v2, fora do escopo deste fix.
  - approve
  # context: nenhum campo correspondente na frontmatter de sub-agente
  # documentada.
  - context
citations:
  read.repository: "code.claude.com/docs/en/tools-reference — nomes de tool confirmados (lido em 2026-10-24)"
  read.documentation: "code.claude.com/docs/en/tools-reference"
  read.audit_trail: "code.claude.com/docs/en/tools-reference"
  read.test_evidence: "code.claude.com/docs/en/tools-reference"
  read.web: "code.claude.com/docs/en/tools-reference"
  write.code: "code.claude.com/docs/en/tools-reference"
  write.documentation: "code.claude.com/docs/en/tools-reference"
  write.test_evidence: "code.claude.com/docs/en/tools-reference"
  write.report: "code.claude.com/docs/en/tools-reference"
  write.pull_request:
    inferido: true
    source: "Bash cobre `gh pr create`, mas não há tool dedicada a pull request — observado em uso (dev-squad), não lido de doc de runtime"
  execute.allow: "code.claude.com/docs/en/tools-reference — Bash"
  network: "code.claude.com/docs/en/tools-reference — WebFetch, WebSearch"
  delegate: "code.claude.com/docs/en/sub-agents — Agent(AgentName)"
  network.allowlist: "code.claude.com/docs/en/sandboxing, lido 2026-10-25 — sandbox.network.allowedDomains; EMITIDO em tools/emit.mjs (fix round 1), caveat de escopo de projeto documentado acima"
  skills: "code.claude.com/docs/en/sub-agents — campo `skills`, lido 2026-10-25; EMITIDO em tools/writers.mjs"
  memory: "code.claude.com/docs/en/sub-agents — campo `memory` (user|project|local), lido 2026-10-25; EMITIDO em tools/writers.mjs; vocabulário de valor não confirmado 1:1 com este acervo"
  budget:
    inferido: true
    source: "ausência confirmada por busca em code.claude.com/docs/en/sub-agents e /settings — nenhum campo de custo/teto encontrado; maxTurns existe mas é proxy de turno, não de gasto"
  execute.deny: "code.claude.com/docs/en/sub-agents (disallowedTools) + code.claude.com/docs/en/permissions (permissions.deny), lidos 2026-10-25 — mecanismo real, NÃO emitido por este emissor (fix round 1); união de projeto seria ativamente errada, ver `source` do arquivo"
  read.database: "code.claude.com/docs/en/permissions (mcp__<server>__<tool>) + code.claude.com/docs/en/sub-agents (disallowedTools), lidos 2026-10-25 — mecanismo real, NÃO emitido (fix round 1): nenhum AGENTS.md nomeia um servidor MCP"
  approve: "code.claude.com/docs/en/permissions — ask rules, lido 2026-10-25 — mecanismo real, NÃO emitido (fix round 1): capabilities.approve não carrega padrão de comando"
  context:
    inferido: true
    source: "nenhum campo 'context' na frontmatter de sub-agente documentada — ausência confirmada por leitura de code.claude.com/docs/en/sub-agents"
