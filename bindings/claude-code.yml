runtime: claude-code
source: >-
  VERIFICADO em 2026-10-24 por leitura direta do formato em uso (plugin
  dev-squad e ~/.claude/agents) para name/description/tools/delegate — e
  RE-VERIFICADO em 2026-10-25 por leitura direta da documentação primária
  (code.claude.com/docs/en) para as cinco capacidades que a pesquisa
  agent-studio/docs/pesquisa/2026-10-25-runtimes-medidos.md corrigiu.

  FIX ROUND 1 (2026-10-25, auditoria pós-tarefa-29): a primeira reescrita
  cometeu a MESMA classe de defeito que corrigia — declarou `translates`
  no nível de "o que o runtime consegue expressar" em vez de "o que este
  emissor de fato escreve no arquivo". `execute.deny`, `read.database` e
  `approve` citavam mecanismo real (confirmado por leitura), mas
  `tools/writers.mjs` não produz nenhum dos três: `disallowedTools` só
  dispara no caso raro em que `execute.allow` está vazio (nenhum papel do
  acervo cai nisso), `read.database` exigiria nomear um servidor MCP que
  o pacote não declara, e `approve` exigiria um padrão de comando que
  `capabilities.approve` (que só referencia `human_gates[].id`) não
  carrega. Investiguei a Opção A (emitir um `.claude/settings.json` de
  projeto com a união de `execute.deny` de todos os papéis) e descobri
  que é ATIVAMENTE PERIGOSA para este acervo, não só incompleta:
  `deny` do Claude Code vale independente de escopo
  ("deny rules from any scope are evaluated before allow rules",
  code.claude.com/docs/en/permissions) — então a união de deny de
  `software-house` bloquearia `git push*`/`git commit*` para
  `desenvolvimento`, que é o ÚNICO papel que precisa deles e os declara
  em `execute.allow`. Um binding que "traduz" `execute.deny` dessa forma
  quebraria o papel que mais precisa de `execute.allow` no mesmo pacote.
  Por isso escolhi a Opção B para as três: mover para `loses`, com o
  mecanismo real nomeado no motivo. `network.allowlist` passou pela MESMA
  pergunta e sobreviveu como `translates`, porque a Opção A ali é segura
  neste acervo (nenhum pacote publicado tem um papel com `network: true`
  convivendo com um papel de outro escopo que precisasse de allowlist
  restrita no MESMO pacote) — `tools/emit.mjs` agora emite de fato um
  `.claude/settings.json` com `sandbox.network.allowedDomains`.

  TAREFA 30 (2026-10-26): o fix round 1 cometeu uma TERCEIRA classe do
  mesmo defeito — chamou de "perdida", com a mesma palavra, tanto a
  capacidade que o Claude Code não tem onde guardar (`budget`, `context` —
  ausência confirmada por busca) quanto a que ele TEM onde guardar e nós
  simplesmente não geramos (`execute.deny`, `read.database`, `approve`).
  Misturar as duas esconde dívida de engenharia (a segunda) detrás do
  limite de um terceiro (a primeira) — ninguém fatura o terceiro pela
  dívida que é nossa. Daí o quarto estado, `not_emitted`, que obriga a
  nomear `mechanism` (o mecanismo real) e `falta` (o que falta para
  gerá-lo). Três correções, uma por capacidade:

  - `execute.deny` → `translates`, de verdade. VERIFIQUEI antes de mudar
    (não aceitei a afirmação de um agente especializado que leu a doc sem
    eu mesmo reler) que o frontmatter de sub-agente aceita um campo
    `hooks` por agente — code.claude.com/docs/en/sub-agents, seção
    "Hooks in subagent frontmatter": "Define hooks directly in the
    subagent's markdown file. These hooks only run while that specific
    subagent is active and are cleaned up when it finishes"; a tabela de
    referência do frontmatter lista `hooks` como campo opcional, "scoped
    to this subagent". Que um `PreToolUse` ali pode negar: code.claude.
    com/docs/en/hooks, "Exit with code 2 to block the action... a
    PreToolUse hook blocks the tool call" — lendo `tool_input.command` do
    JSON em stdin para o tool `Bash`. E que o escopo é o AGENTE, não o
    projeto — exatamente o que torna isso seguro onde a Opção A de
    projeto não era: o hook de `desenvolvimento` nunca vê os padrões de
    `revisao`, e vice-versa, porque cada um vive só no frontmatter do
    próprio agente. `tools/writers.mjs` agora EMITE esse hook de verdade —
    destino `[]` em `translates` porque o mecanismo vive em
    `frontmatter.hooks`, não na lista `tools` (mesmo padrão de
    `skills`/`memory`/`network.allowlist`).
  - `read.database` → `not_emitted`: o mecanismo (composição de `tools:
    mcp__<servidor>__<ferramenta>` + `disallowedTools: Bash`) é real e
    nomeado, mas nenhum `AGENTS.md` do acervo declara qual servidor MCP
    expõe o banco — o Claude Code TEM onde guardar isso; só não temos o
    dado para escrever. Avaliei onde esse dado deveria morar:
    `requirements` (campo de topo da spec base `agentcompanies/v1`, já
    usado para `secrets`) é o lugar certo — é exatamente o padrão "o que
    o cliente declara antes de rodar", e não exige crescer
    `capabilities/v1` nem `metadata.*`. Nenhum pacote do acervo declara
    isso hoje; nomear o lugar certo não é o mesmo que inventar o valor.
  - `approve` → `not_emitted`: com `human_gates[].triggers` (tarefa 30,
    §3), `permissions.ask` passa a ser DE FATO emitido — mas em escopo de
    EMPRESA (`.claude/settings.json`, união dos gatilhos de todo
    `human_gates` do pacote), não amarrado a `capabilities.approve` de
    agente nenhum. `approve` continua sem lugar porque referencia
    `human_gates[].id` para dizer "este papel PODE ASSINAR" — e nenhum
    mecanismo do Claude Code expressa isso; `ask` pausa para QUALQUER
    sessão confirmar, não registra QUEM é o signer. Nenhum papel real do
    acervo declara `approve` não-vazio (E14 e a segregação de função do
    `software-house`/`fabrica-de-testes` tornam isso certo por desenho) —
    mas a célula continua coberta, porque "nenhum agente usa hoje" não é
    "o binding não precisa declarar".

  `budget` CONTINUA em `loses` — ausência de campo de custo confirmada por
  busca, nenhuma mudança aqui. Mas `maxTurns` existe, é por agente, e é
  proxy de TURNO, não de GASTO — decisão (critérios: o acervo não declara
  número de turno em lugar nenhum hoje; proxy emitido sem o operador saber
  que é proxy é pior que nenhum): ACRESCENTAR `budget.max_turns` opcional
  (sub-campo de estrutura livre — `budget` já não é lista fechada, então
  isto não cresce `capabilities/v1.mjs`) e EMITIR `maxTurns` quando
  declarado. O nome do campo já avisa o operador que é turno, não
  dinheiro — a ambiguidade que o segundo critério teme seria reescrever
  `budget.monthly_cap` em turnos, não nomear um campo novo e distinto.
  Nenhum papel do acervo declara `max_turns` hoje; a emissão é exercida só
  por teste sintético, não por invenção num pacote real.
emits: .claude/agents/<slug>.md
format: claude-code
# first-match (leitura honesta, não medição direta): a doc de permissões
# (code.claude.com/docs/en/permissions, "The same holds across settings
# scopes: ... deny rules from any scope are evaluated before allow rules")
# descreve deny-sempre-vence, independente de posição na lista — mais perto
# do modelo first-match (checa deny antes de qualquer allow, não importa a
# ordem de escrita) do que do last-match do OpenCode V2. Não há tabela
# explícita "first-match vs last-match" na doc do Claude Code porque o
# conceito de ordenação de lista não é o mecanismo real — é a aproximação
# mais honesta dentro do vocabulário deste binding.
rule_order: first-match
# allowlist_scope: os. sandbox.network.allowedDomains é interceptado pelo
# proxy de sandbox do sistema operacional (Seatbelt no macOS, namespace de
# rede no Linux/WSL2), e cobre TODO processo filho, shell cru incluído —
# não só a tool de busca. Fonte: code.claude.com/docs/en/sandboxing,
# lido em 2026-10-25 ("Claude Code runs the sandbox proxy on your machine,
# outside the sandbox... The proxy checks the hostname of each connection
# against your allowed and denied domains"). CAVEAT que sobrevive do fix
# round 1: o `.claude/settings.json` emitido é de ESCOPO DE PROJETO, não
# por agente — um papel com `network: false` ainda compartilha a mesma
# allowedDomains que um papel do mesmo pacote com domínio declarado,
# porque o sandbox não tem campo por agente confirmado em nenhuma doc
# lida. É alargamento de fronteira para o papel `network: false`, não
# estreitamento — documentado aqui, não escondido.
allowlist_scope: os
translates:
  read.repository: [Read, Grep, Glob]
  read.documentation: [Read, Grep, Glob]
  read.audit_trail: [Read, Grep, Glob]
  read.test_evidence: [Read, Grep, Glob]
  read.web: [WebFetch, WebSearch]
  write.code: [Write, Edit]
  write.documentation: [Write, Edit]
  write.test_evidence: [Write, Edit]
  write.report: [Write, Edit]
  write.pull_request: [Bash]
  execute.allow: [Bash]
  network: [WebFetch, WebSearch]
  delegate: "Agent({slug})"
  # network.allowlist: EMITIDO de verdade (fix round 1). tools/emit.mjs
  # escreve `.claude/settings.json` com `sandbox.network.allowedDomains`
  # = união dos domínios de `capabilities.network` de todo agente do
  # pacote — allowlist de SISTEMA OPERACIONAL, cobre shell cru também
  # (ver allowlist_scope acima). Destino [] porque o mecanismo não entra
  # na lista `tools` do frontmatter — vive num arquivo-irmão.
  network.allowlist: []
  # skills: EMITIDO de verdade — tools/writers.mjs escreve `skills:` no
  # frontmatter a partir de `frontmatter.skills`, testado em
  # test/emit.test.mjs. Destino [] porque não é "ferramenta", é campo de
  # frontmatter escrito direto.
  skills: []
  # memory: EMITIDO de verdade — mesma lógica de skills, a partir de
  # `metadata.memory.scope`. Vocabulário de VALOR não combina 1:1 (este
  # acervo usa none/session/project/org; Claude Code usa
  # user/project/local) — "project" coincide, os outros três são
  # aproximação do emissor, não medição. O CAMPO traduz; o valor fora de
  # "project" é aproximação assumida, não garantida.
  memory: []
  # execute.deny: TAREFA 30 — volta de `loses` para `translates`, agora de
  # fato EMITIDO. VERIFICADO (não assumido) que o frontmatter de
  # sub-agente aceita `hooks` por agente, escopado a esse agente, e que um
  # `PreToolUse` ali pode negar (ver `source` acima, citação completa em
  # `citations.execute.deny`). `tools/writers.mjs` escreve
  # `frontmatter.hooks.PreToolUse` com um hook `command` que lê
  # `tool_input.command` do stdin e nega (`exit 2`) quando casa um dos
  # globs de `execute.deny` DESTE agente. Destino `[]` pelo mesmo motivo
  # de `skills`/`memory`/`network.allowlist`: o mecanismo não entra na
  # lista `tools`, vive em campo de frontmatter próprio.
  execute.deny: []
preserves: []
loses:
  # budget: sem teto de moeda em lugar nenhum da configuração do Claude
  # Code (frontmatter de sub-agente ou settings.json) — busca feita em
  # code.claude.com/docs/en/sub-agents e code.claude.com/docs/en/settings
  # não encontrou campo de custo. `maxTurns` existe (confirmado,
  # sub-agents) e É EMITIDO (tarefa 30) como `budget.max_turns` — campo
  # OPCIONAL, novo, que nomeia explicitamente que é proxy de TURNO, não de
  # GASTO; `budget` (o teto de custo) continua perdido de verdade, porque
  # a ausência do campo de custo em si não mudou.
  - budget
  # context: nenhum campo correspondente na frontmatter de sub-agente
  # documentada.
  - context
not_emitted:
  # read.database: TAREFA 30 — sai de `loses`, entra aqui. O Claude Code
  # TEM onde guardar isso (mcp__<servidor>__<ferramenta> é um nome de
  # tool real, e disallowedTools: Bash reforça em profundidade) — só não
  # temos o dado para escrever, porque nenhum AGENTS.md do acervo declara
  # qual servidor MCP expõe o banco. `requirements` (campo de topo da spec
  # base, já usado para `secrets`) é a resposta avaliada para onde esse
  # dado deveria morar — ver `source` acima.
  read.database:
    mechanism: "tools: mcp__<servidor>__<ferramenta> + disallowedTools: Bash"
    falta: "o pacote não declara qual servidor MCP expõe o banco (ex.: em requirements)"
  # approve: TAREFA 30 — sai de `loses`, entra aqui. `permissions.ask` é
  # mecanismo real e, com `human_gates[].triggers`, É de fato emitido em
  # `.claude/settings.json` — mas em escopo de EMPRESA, não amarrado a
  # `capabilities.approve` de nenhum agente: o mecanismo pausa para
  # qualquer sessão confirmar, não registra QUEM pode assinar.
  approve:
    mechanism: "permissions.ask, emitido em .claude/settings.json a partir de human_gates[].triggers"
    falta: "capabilities.approve referencia human_gates[].id, não um padrão de comando; o ask emitido é de empresa, não amarrado a qual agente aprova, e não registra o signer nomeado"
citations:
  read.repository: "code.claude.com/docs/en/tools-reference — nomes de tool confirmados (lido em 2026-10-24)"
  read.documentation: "code.claude.com/docs/en/tools-reference"
  read.audit_trail: "code.claude.com/docs/en/tools-reference"
  read.test_evidence: "code.claude.com/docs/en/tools-reference"
  read.web: "code.claude.com/docs/en/tools-reference"
  write.code: "code.claude.com/docs/en/tools-reference"
  write.documentation: "code.claude.com/docs/en/tools-reference"
  write.test_evidence: "code.claude.com/docs/en/tools-reference"
  write.report: "code.claude.com/docs/en/tools-reference"
  write.pull_request:
    inferido: true
    source: "Bash cobre `gh pr create`, mas não há tool dedicada a pull request — observado em uso (dev-squad), não lido de doc de runtime"
  execute.allow: "code.claude.com/docs/en/tools-reference — Bash"
  network: "code.claude.com/docs/en/tools-reference — WebFetch, WebSearch"
  delegate: "code.claude.com/docs/en/sub-agents — Agent(AgentName)"
  network.allowlist: "code.claude.com/docs/en/sandboxing, lido 2026-10-25 — sandbox.network.allowedDomains; EMITIDO em tools/emit.mjs (fix round 1), caveat de escopo de projeto documentado acima"
  skills: "code.claude.com/docs/en/sub-agents — campo `skills`, lido 2026-10-25; EMITIDO em tools/writers.mjs"
  memory: "code.claude.com/docs/en/sub-agents — campo `memory` (user|project|local), lido 2026-10-25; EMITIDO em tools/writers.mjs; vocabulário de valor não confirmado 1:1 com este acervo"
  budget:
    inferido: true
    source: "ausência de campo de custo confirmada por busca em code.claude.com/docs/en/sub-agents e /settings — nenhum campo de custo/teto encontrado. maxTurns existe (sub-agents) e É emitido como budget.max_turns (tarefa 30) — proxy de turno, não de gasto; o nome do campo novo já avisa o operador disso"
  execute.deny: "code.claude.com/docs/en/sub-agents, seção \"Hooks in subagent frontmatter\" (hooks por agente, escopados a esse agente) + code.claude.com/docs/en/hooks (exit code 2 bloqueia o PreToolUse), lidos e RE-VERIFICADOS em 2026-10-26 — mecanismo real E EMITIDO (tarefa 30) em tools/writers.mjs, por agente"
  read.database: "code.claude.com/docs/en/permissions (mcp__<server>__<tool>) + code.claude.com/docs/en/sub-agents (disallowedTools), lidos 2026-10-25 — mecanismo real, NÃO emitido (tarefa 30, not_emitted): nenhum AGENTS.md nomeia um servidor MCP"
  approve: "code.claude.com/docs/en/permissions — ask rules, lido 2026-10-25 — mecanismo real e, com human_gates[].triggers, EMITIDO em escopo de empresa (tarefa 30); mas not_emitted por agente: capabilities.approve não carrega padrão de comando nem é o que o ask emitido amarra"
  context:
    inferido: true
    source: "nenhum campo 'context' na frontmatter de sub-agente documentada — ausência confirmada por leitura de code.claude.com/docs/en/sub-agents"
unsupported: []
unsupported_metadata: []
