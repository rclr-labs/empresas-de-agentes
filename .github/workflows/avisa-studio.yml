name: avisa a vitrine

# O acervo não sabe nada sobre a vitrine além de um nome de repo: ele toca o
# sino e vai embora. Quem decide o que publicar é a vitrine, lendo o ref de
# vitrine.json — por isso este workflow NÃO manda SHA, branch nem payload
# nenhum. Payload é campo que o emissor escolhe; se a vitrine publicasse o que
# chega aqui, este arquivo passaria a ser o lugar de onde se escolhe o que vai
# pro ar.
on:
  push:
    branches: [main]
    # Filtro por EXCLUSÃO, de propósito. Os pacotes são diretórios da RAIZ
    # (software-house/, fabrica-de-testes/, …), não vivem sob um prefixo
    # comum — então listar o que dispara significaria enumerar os 8, e o
    # nono pacote nasceria fora do filtro, em silêncio. Listar o que NÃO
    # dispara é uma lista curta e estável, e pacote novo entra sozinho.
    #
    # (Escrevi este filtro como 'pacotes/**' na primeira versão, contra uma
    # estrutura que eu supus em vez de olhar. Nunca teria disparado.)
    paths-ignore:
      - 'docs/**'
      - 'test/**'
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions: {}

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Dispara o deploy da vitrine
        # PRÉ-REQUISITO AINDA NÃO ATENDIDO (2026-10-27): o segredo
        # STUDIO_DISPATCH_TOKEN não existe neste repo. Precisa ser um token com
        # permissão de escrita em rclr-labs/agent-studio — só `contents:write`,
        # que é o mínimo que o endpoint de dispatch aceita.
        #
        # O GITHUB_TOKEN padrão NÃO serve: ele é escopado a ESTE repositório e
        # não alcança o Studio. Cruzar repo exige credencial própria, e é isso
        # que torna o gatilho um passo de dashboard e não de código.
        env:
          GH_TOKEN: ${{ secrets.STUDIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "STUDIO_DISPATCH_TOKEN ausente — a vitrine não foi avisada."
            echo "Enquanto o segredo não existir, republicar é manual:"
            echo "  gh workflow run vitrine -R rclr-labs/agent-studio"
            exit 1
          fi
          gh api repos/rclr-labs/agent-studio/dispatches \
            -f event_type=acervo-atualizado
